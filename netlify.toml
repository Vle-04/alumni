# Netlify hosting (see README → Deploying on Netlify and DECISIONS D101).
# Next.js runs as serverless functions via Netlify's Next.js runtime (added automatically).
# Background jobs run from the scheduled functions in netlify/functions instead of `npm run worker`.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Two ways to deploy: Netlify builds main (a push, or "Deploy" in the Netlify dashboard), or
# `npm run deploy:netlify` builds on the developer's computer. Either way the build never touches the
# database; the new deploy applies pending migrations via POST /api/ops/migrate (the plugin below for
# Netlify builds, the deploy script for local ones).
[[plugins]]
  package = "/netlify/plugins/migrate-after-deploy"

[functions]
  # Prisma's query engine must ship with the functions.
  included_files = ["node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node", "prisma/schema.prisma"]
